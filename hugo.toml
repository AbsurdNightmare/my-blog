    identifier = 'blog'
    name = '博客'
    url = '/blog/'
    weight = 1
  [[menu.main]]
    identifier = 'art'
    name = '随笔'
    url = '/art/'
    weight = 2
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 3
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 4
  [[menu.main]]
