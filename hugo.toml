baseURL = 'https://absurdnightmare.github.io/my-blog/'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
title = 'AbsurdNightmare'
theme = 'hugo-theme-ladder'

hasCJKLanguage = true
summaryLength = 80
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  series = 'series'

[params]
  brand = 'HOME'
  author = 'AbsurdNightmare'
  authorDescription = 'ECNU 大三 软件工程'
  info = '欢迎来到我的博客! 希望这里的内容可以对你的学习/生活带来帮助。'
  avatarURL = 'images/avatar.png'
  favicon = 'images/avatar.png'
  mainSections = ['blog', 'art']

  [params.options]
    showDarkMode = true
    enableImgZooming = true
    showMetaTags = true
    enableMultiLang = false

